name: Feature request
description: Propose a change or addition.
labels: [enhancement, triage]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What is hard or impossible today? Describe the problem, not the solution.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Where would this live?
      options:
        - apps
        - packages
        - services
        - infrastructure
        - docs
        - not sure
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
    validations:
      required: false

  - type: checkboxes
    id: adr
    attributes:
      label: Scope
      options:
        - label: This is hard to reverse and likely needs an ADR in docs/architecture/adr/
